name: Atualiza dados
on:
  schedule:
    - cron: '0 10 * * *'   # 7h de Brasília, todo dia
  workflow_dispatch: {}     # botão "Run workflow" para rodar na hora
  push:                     # roda também quando o robô é alterado (os commits de dados não disparam)
    branches: [main]
    paths: ['scripts/**', '.github/workflows/**']
permissions:
  contents: write
concurrency: atualiza
jobs:
  atualiza:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar fontes
        env:
          SOSOVALUE_API_KEY: ${{ secrets.SOSOVALUE_API_KEY }}
          ALPHRACTAL_API_KEY: ${{ secrets.ALPHRACTAL_API_KEY }}
          ALPHRACTAL_API_URL: ${{ secrets.ALPHRACTAL_API_URL }}
        run: node scripts/atualiza.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Gravar
        run: |
          git config user.name "robo-termometro"
          git config user.email "robo-termometro@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "nada mudou" || (git commit -m "Dados de $(TZ=America/Sao_Paulo date +%d/%m/%Y)" && git pull --rebase -X theirs origin main && git push)
